<!DOCTYPE html>

  <style>
    :root {
      --bg: #000;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --soft: #111;
      --border: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .card {
      width: min(560px, 100%);
      padding: 40px 28px 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--soft);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 800;
      color: #000;
      background: #f5f5f5;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin-bottom: 10px;
    }

    .tag {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
      text-align: left;
    }

    .item {
      padding: 16px 14px;
      border-radius: 16px;
      background: #0a0a0a;
      border: 1px solid var(--border);
    }

    .item.full { grid-column: 1 / -1; }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .value {
      font-size: 15px;
      word-break: break-word;
      line-height: 1.4;
    }

    .value a {
      color: inherit;
      text-decoration: none;
    }

    .value a:hover { text-decoration: underline; }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      color: #000;
      text-decoration: none;
      background: #f5f5f5;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(0.94);
    }

    .btn.secondary {
      color: #f5f5f5;
      background: transparent;
      border: 1px solid var(--border);
    }

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: #737373;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .info { grid-template-columns: 1fr; }
      .card { padding: 32px 18px 22px; }
      .buttons { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

    <h1>His name is Arnav.</h1>
    <p class="tag">Personal profile · @_arnav9753</p>

    <section class="info" aria-label="Contact details">
      <div class="item">
        <div class="label">Status</div>
        <div class="value">Single</div>
      </div>
      <div class="item">
        <div class="label">Phone</div>
        <div class="value"><a href="tel:+919874375971">9874375971</a></div>
      </div>
      <div class="item full">
        <div class="label">Email</div>
        <div class="value"><a href="mailto:arnabmondal7002@gmail.com">arnabmondal7002@gmail.com</a></div>
      </div>
      <div class="item full">
        <div class="label">Instagram</div>
        <div class="value"><a href="https://www.instagram.com/_arnav9753/" target="_blank" rel="noopener noreferrer">@_arnav9753</a></div>
      </div>
    </section>

    <div class="buttons">
      <a class="btn" href="tel:+919874375971">Call Me</a>
      <a class="btn secondary" href="mailto:arnabmondal7002@gmail.com">Email Me</a>
      <a class="btn secondary" href="https://www.instagram.com/_arnav9753/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>

    <footer>© 2026 Arnav. Free personal website.</footer>
  </main>
</body>
</html>
